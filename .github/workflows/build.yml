name: Build Vanta Client
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Extract zip
        run: unzip vanta-client.zip
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        run: cd vanta-client && gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: vanta-client
          path: vanta-client/build/libs/vanta-*.jar
